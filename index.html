<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Портфолио</title>
    <!-- CSS файлын қосу -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Жоғарғы қара блок (Hero section) -->
    <header class="hero">
        <h1>Сәлем! Мен <span class="highlight">[Гулшарат]</span></h1>
        <p class="subtitle">Информатика пәні мұғалімі</p>
    </header>

    <!-- Негізгі мазмұны -->
    <main class="container">
        <!-- Мен туралы блок -->
        <section class="card">
            <h2>Мен туралы</h2>
            <p>Мен веб-бағдарламалауды үйреніп жүрмін. VS Code және GitHub сияқты құралдарды меңгерудемін.</p>
        </section>

        <!-- Дағдыларым блок -->
        <section class="card">
            <h2>Дағдыларым</h2>
            <div class="skills-list">
                <div class="skill-item">HTML & CSS</div>
                <div class="skill-item">Git & GitHub</div>
                <div class="skill-item">JavaScript (негіздері)</div>
            </div>
        </section>
    </main>

    <!-- Футер -->
    <footer>
        <p>© 2026 Барлық құқықтар қорғалған.</p>
    </footer>

</body>
</html>
